aid: pharmazz
name: Pharmazz
description: >-
  Pharmazz, Inc. is a privately held, clinical-stage biopharmaceutical company headquartered in
  Willowbrook, Illinois, founded and led by pharmacologist Dr. Anil Gulati. The company discovers,
  develops and commercializes first-in-class therapeutics for critical care and neurovascular
  medicine, built around two lead small-molecule candidates: centhaquine (Lyfaquin), a resuscitative
  agent for hypovolemic shock that holds marketing authorization from the Drugs Controller General
  of India and is licensed to Dr. Reddy's Laboratories for the Indian market, and sovateltide
  (Tycamzzi), an endothelin-B receptor agonist for cerebral ischemic stroke. Additional pipeline
  programs target septic shock, acute kidney injury, cardiac arrest, acute spinal cord injury,
  hypoxic-ischemic encephalopathy and Alzheimer's disease. Pharmazz is a drug-development company,
  not a software vendor; its public web presence is a corporate and investor brochure site and it
  operates no developer program, public API, SDK or machine-readable interface.
